<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0b0c">
<title>Encore</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
<script src="/gate.js" defer></script>
</head>
<body class="center">
<form id="encore-gate" class="door" autocomplete="off">
  <h1>Encore</h1>
  <label for="code">Code</label>
  <input id="code" name="code" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" autofocus required>
  <p id="problem" class="problem" role="alert" hidden></p>
  <button type="submit" class="primary">Enter</button>
</form>
</body>
</html>
