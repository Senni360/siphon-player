name: Media gateway

on:
  push:
    branches: [main]
    paths:
      - services/media-gateway/**
      - .github/workflows/media-gateway.yml
  pull_request:
    paths:
      - services/media-gateway/**
      - .github/workflows/media-gateway.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: media-gateway-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check syntax and private-media lifecycle
        working-directory: services/media-gateway
        run: |
          npm run check
          npm test
